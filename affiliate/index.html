<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#B5202A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Affiliate">
  <title>Laris Affiliate</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/brand/appicon-red.png">
  <link rel="icon" href="/images/brand/appicon-red.png">
  <link rel="stylesheet" href="/fonts/laris-fonts.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="prod-block" hidden aria-hidden="true">
    <p>Prototype LAN. Tidak untuk larisid.com.</p>
  </div>
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="/images/brand/appicon-red.png" width="32" height="32" alt="">
        <div>
          <strong>Laris Affiliate</strong>
          <span class="off-badge">LAN · bukan blast</span>
        </div>
      </div>
      <div id="quota-chip" class="quota-chip" aria-live="polite"></div>
    </header>
    <main id="main" class="main"></main>
    <nav class="dock" id="dock" aria-label="Menu"></nav>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="./js/seed.js"></script>
  <script src="./js/send.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
