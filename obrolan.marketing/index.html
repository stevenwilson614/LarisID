<head>

      location.replace('https://larisid.com' + location.pathname + location.search + location.hash);

  <base href="/obrolan.marketing/">

  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101012">
  <script>
    /* Apply the saved theme before the stylesheet paints to avoid a dark flash. */
    try {
      if (localStorage.getItem('anton-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch (e) { /* storage blocked */ }
  </script>
  <style>
    /* Hide shell until JS fills the correct school identity — coach URLs reuse this HTML. */
    html.lms-booting #app { visibility: hidden; }
  </style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kelas">
  <meta name="application-name" content="Kelas">
  <link rel="apple-touch-icon" href="/obrolan.marketing/assets/obrolan/logo-mark.png">
  <link rel="manifest" href="/obrolan.marketing/manifest.webmanifest">
  <title>Kelas</title>
  <script>
    /* Homescreen must open this class (/s/{slug}/), never mentor /lms/. */
    (function () {
      var path = location.pathname || '';
      var m = path.match(/^\/s\/([^/]+)/i);
      var slug = m ? decodeURIComponent(m[1]).toLowerCase() : '';
      if (!slug && /^\/obrolan\.marketing\/?/i.test(path)) slug = 'obrolan.marketing';
      if (!slug) return;
      var start = '/s/' + encodeURIComponent(slug) + '/';
      var man = document.querySelector('link[rel="manifest"]');
      function applyManifest(info) {
        if (!man) return;
        var name = String((info && info.name) || (info && info.short_name) || slug).trim() || slug;
        var short = String((info && info.short_name) || name).trim().slice(0, 12) || name.slice(0, 12);
        var icons = (info && info.icons && info.icons.length)
          ? info.icons
          : [{ src: '/obrolan.marketing/assets/obrolan/logo-mark.png', sizes: '192x192', type: 'image/png', purpose: 'any' }];
        var body = {
          name: name,
          short_name: short,
          start_url: start,
          scope: start,
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#101012',
          theme_color: '#101012',
          lang: 'id',
          icons: icons
        };
        man.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(body)));
        var apple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (apple) apple.setAttribute('content', name.slice(0, 40));
        var appName = document.querySelector('meta[name="application-name"]');
        if (appName) appName.setAttribute('content', name.slice(0, 40));
        document.title = name;
        if (icons[0] && icons[0].src) {
          var touch = document.querySelector('link[rel="apple-touch-icon"]');
          if (touch) touch.setAttribute('href', icons[0].src);
        }
      }
      /* Set start_url immediately so Add to Home Screen cannot fall back to /lms/. */
      applyManifest({ name: slug });
      try {
        var x = new XMLHttpRequest();
        x.open('GET', '/obrolan.marketing/api/manifest?slug=' + encodeURIComponent(slug), false);
        x.send(null);
        if (x.status === 200) applyManifest(JSON.parse(x.responseText || '{}'));
      } catch (e) { /* offline — keep start_url from above */ }
    })();
  </script>
  <link rel="stylesheet" href="/fonts/laris-fonts.css">
  <link rel="stylesheet" href="./css/school.css?v=20261029tone">
  <link rel="stylesheet" href="./css/diskusi-chat.css?v=20261029cmt">
</head>
