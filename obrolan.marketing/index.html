      location.replace('https://larisid.com' + location.pathname + location.search + location.hash);
    }

  <base href="/obrolan.marketing/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#18181b">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anton">

<body>
  <div id="prod-block" hidden>
    <p>Kelas ini dibuka di larisid.com/obrolan.marketing.</p>
  </div>
  <div id="slug-miss" class="slug-miss" hidden>
    <p>Sekolah <strong data-asked></strong> tidak ada di prototype ini.</p>
    <p class="muted">Kelas Anton: <a href="/obrolan.marketing/"><span data-known>obrolan.marketing</span></a></p>
  </div>
  <div id="app" class="is-student">
    <header class="topbar">
      <div class="brand">
        <div class="brand-menu" id="brand-menu">
          <button type="button" class="brand-avatar" id="btn-school-profil" data-act="brand-menu-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="brand-dd" title="Profile menu" aria-label="Profile menu">
            <img id="school-logo" src="./assets/obrolan/profile.png" alt="" width="32" height="32">
          </button>
          <div class="brand-dd" id="brand-dd" role="menu" hidden>
            <button type="button" role="menuitem" data-act="open-profil">Profile</button>
            <button type="button" role="menuitem" data-act="open-account">Account settings</button>
          </div>
        </div>
        <div class="brand-copy">
          <strong id="school-name">Anton GC</strong>
          <span id="school-header" class="school-header" hidden></span>
        </div>
      </div>
      <div class="topbar-search" id="topbar-search" hidden>
        <label class="sr-only" for="cari-siswa">Cari siswa</label>
        <input type="search" id="cari-siswa" placeholder="Cari siswa…" data-act="cari-siswa" autocomplete="off" enterkeyhint="search">
        <div id="cari-siswa-drop" class="cari-drop" hidden></div>
      </div>
      <div class="topbar-actions">
        <label class="sr-only" for="role-switch">Peran</label>
        <select id="role-switch" aria-label="Peran" hidden></select>
        <label class="sr-only" for="persona-switch">Siswa</label>
        <select id="persona-switch" aria-label="Pilih siswa" hidden></select>
        <button type="button" class="ghost" id="btn-reset" title="Reset data lokal" hidden>Reset</button>
        <button type="button" class="ghost" id="btn-admin-out" hidden>Keluar</button>
      </div>
    </header>
    <div class="workspace">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <main id="main" class="main"></main>
    </div>
    <nav class="dock" id="dock" hidden></nav>
  </div>
  <aside id="drawer" class="drawer" hidden></aside>
  <div id="drawer-scrim" class="scrim" hidden></div>
  <div id="profile-preview" class="prof-preview" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="./js/seed.js?v=20261027profil5"></script>
  <script src="./js/app.js?v=20261027profil5"></script>

</html>
