<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Kalkulator harga — Anton</title>
  <script>
    (function () {
      var root = document.documentElement;
      function sync(v) { if (v === 'light') root.dataset.theme = 'light'; else delete root.dataset.theme; }
      try {
        sync(localStorage.getItem('anton-theme'));
        window.addEventListener('storage', function (e) { if (e.key === 'anton-theme') sync(e.newValue); });
      } catch (e) { /* storage blocked */ }
    })();
  </script>
  <link rel="stylesheet" href="/fonts/laris-fonts.css">
  <link rel="stylesheet" href="../css/school.css?v=20261027calc3">
  <style>
    body { padding: 16px 16px 40px; max-width: 920px; margin: 0 auto; }
    .brand-lock { display: block; height: 26px; width: auto; margin: 0 0 12px; }
    button[data-act] { cursor: pointer; }
  </style>
</head>
<body>
  <img class="brand-lock" src="../assets/obrolan/logo-lockup.png" alt="Obrolan Marketing">
  <div id="calc-mount"></div>
  <script src="../js/calc-engine.js?v=20261027calc4"></script>
  <script>
    (function () {
      var mount = document.getElementById('calc-mount');
      mount.innerHTML = AntonCalc.shellHtml();
      var root = document.getElementById('calc-tool');
      AntonCalc.attach(root, { dataUrl: '../data/tiktok-kategori-fees.json' });
      mount.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-act]');
        if (!btn || !root.__calc) return;
        var act = btn.getAttribute('data-act');
        if (act === 'calc-contoh') root.__calc.contoh();
        else if (act === 'calc-kosong') root.__calc.kosong();
        else if (act === 'calc-pdf') root.__calc.pdf();
        else if (act === 'calc-tab') root.__calc.tab(btn.getAttribute('data-pane') || 'set');
      });
    })();
  </script>
</body>
</html>
