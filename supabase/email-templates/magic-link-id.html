<!--
  LarisID - email masuk tautan ajaib / magic link (Bahasa Indonesia)
  Supabase Auth template. Variabel wajib: {{ .ConfirmationURL }}
  Terapkan ke: Auth -> Email Templates -> "Magic Link"
  Subjek: Tautan masuk ke LarisID
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5EFE0;margin:0;padding:24px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #EADFC9;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#1A1A1A;padding:22px 28px;">
            <img src="https://larisid.com/images/brand/logo-horizontal-light.png" alt="LarisID" width="118" style="display:block;border:0;height:auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:32px 28px 8px;">
            <h1 style="margin:0 0 12px;font-size:21px;line-height:1.3;color:#1A1A1A;font-weight:800;letter-spacing:-.01em;">Masuk ke LarisID</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:#4B4636;">Klik tombol di bawah untuk langsung masuk ke akunmu &mdash; tanpa perlu kata sandi.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 28px 28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#B5202A;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 34px;border-radius:10px;">Masuk Sekarang</a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 28px;">
            <p style="margin:0 0 6px;font-size:12.5px;line-height:1.6;color:#8B8375;">Tombol tidak berfungsi? Salin dan tempel tautan ini ke browser kamu:</p>
            <p style="margin:0;font-size:12.5px;line-height:1.6;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#B5202A;">{{ .ConfirmationURL }}</a></p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 30px;">
            <p style="margin:0;font-size:12.5px;line-height:1.6;color:#8B8375;border-top:1px solid #EADFC9;padding-top:18px;">Tidak meminta tautan ini? Abaikan saja email ini.</p>
          </td>
        </tr>
        <tr>
          <td style="background:#F5EFE0;padding:18px 28px;text-align:center;">
            <p style="margin:0;font-size:12px;color:#8B8375;font-weight:600;letter-spacing:.02em;">Dari penjual, untuk penjual &middot; <a href="https://larisid.com" style="color:#B5202A;text-decoration:none;">larisid.com</a></p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
