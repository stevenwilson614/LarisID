# Deploy static site to Contabo + Cloudflare Pages on every push to main.
# GitHub Pages is retired (ToS / commercial SaaS). Live domain DNS points at Contabo;
# Cloudflare Pages is the CDN mirror at larisid.pages.dev.
#
# Requires repo secrets (when GitHub account is restored):
#   CLOUDFLARE_API_TOKEN  — Pages edit permission
#   CLOUDFLARE_ACCOUNT_ID — 721a30ed6330104bd87c64e6024b240f
#   CONTABO_SSH_KEY       — private key for root@84.247.147.205
#
# Until Actions can run, deploy from a laptop:
#   bash scripts/deploy-static.sh

name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: bash scripts/assemble-site.sh _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=larisid --branch=main

      - name: Sync to Contabo (larisid.com)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 84.247.147.205
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          source: "_site/*"
          target: /root/larisid-infra/docker/volumes/www/larisid
          strip_components: 1
          overwrite: true
          rm: true

      - name: Ping IndexNow (Bing)
        run: |
          KEY=55677968d982482614b7ad24398e836c
          URLS=$(grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g')
          JSON=$(jq -n \
            --arg host "larisid.com" \
            --arg key "$KEY" \
            --arg keyloc "https://larisid.com/$KEY.txt" \
            --argjson urls "$(printf '%s\n' $URLS | jq -R . | jq -s .)" \
            '{host:$host,key:$key,keyLocation:$keyloc,urlList:$urls}')
          echo "Submitting $(echo "$URLS" | wc -l | tr -d ' ') URLs to IndexNow..."
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$JSON" -w "\nIndexNow HTTP %{http_code}\n" || true
