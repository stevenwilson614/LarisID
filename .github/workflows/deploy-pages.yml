# Deploy static site (index.html + images + CNAME) to GitHub Pages on every push to main.
# Repo settings → Pages → Build and deployment → Source: **GitHub Actions** (required once).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html CNAME robots.txt sitemap.xml llms.txt BingSiteAuth.xml 55677968d982482614b7ad24398e836c.txt _site/
          cp -r images styles js privacy perbandingan harga tentang cara-kerja riset _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing (IndexNow) about every URL in the sitemap as soon as we deploy.
      - name: Ping IndexNow (Bing)
        run: |
          KEY=55677968d982482614b7ad24398e836c
          URLS=$(grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g')
          JSON=$(jq -n \
            --arg host "larisid.com" \
            --arg key "$KEY" \
            --arg keyloc "https://larisid.com/$KEY.txt" \
            --argjson urls "$(printf '%s\n' $URLS | jq -R . | jq -s .)" \
            '{host:$host,key:$key,keyLocation:$keyloc,urlList:$urls}')
          echo "Submitting $(echo "$URLS" | wc -l | tr -d ' ') URLs to IndexNow..."
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$JSON" -w "\nIndexNow HTTP %{http_code}\n" || true
