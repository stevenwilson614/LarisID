# Deploy static site to Contabo + Cloudflare Pages on every push to main.
# GitHub Pages is retired (ToS / commercial SaaS). Live domain DNS points at Contabo;
# Cloudflare Pages is the CDN mirror at larisid.pages.dev.
#
# Repo secrets (set 2026-08-24): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# CONTABO_SSH_KEY (private key for root@84.247.147.205).
#
# Manual fallback: bash scripts/deploy-static.sh

name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: bash scripts/assemble-site.sh _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=larisid --branch=main

      - name: Sync to Contabo (larisid.com)
        # rsync --delete updates files in place (same directory inode) so the
        # Caddy container's bind mount stays live. scp-action's `rm: true`
        # deletes+recreates the target dir instead, which orphans the mount
        # and 404s the site until the container is restarted — don't use it.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          rsync -az --delete -e "ssh -i ~/.ssh/contabo_key -o StrictHostKeyChecking=no" \
            _site/ root@84.247.147.205:/root/larisid-infra/docker/volumes/www/larisid/

      - name: Ping IndexNow (Bing)
        run: |
          KEY=55677968d982482614b7ad24398e836c
          URLS=$(grep -oE '<loc>[^<]+</loc>' sitemap.xml | sed -E 's#</?loc>##g')
          JSON=$(jq -n \
            --arg host "larisid.com" \
            --arg key "$KEY" \
            --arg keyloc "https://larisid.com/$KEY.txt" \
            --argjson urls "$(printf '%s\n' $URLS | jq -R . | jq -s .)" \
            '{host:$host,key:$key,keyLocation:$keyloc,urlList:$urls}')
          echo "Submitting $(echo "$URLS" | wc -l | tr -d ' ') URLs to IndexNow..."
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$JSON" -w "\nIndexNow HTTP %{http_code}\n" || true
