<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=1080">
<title>LARISE Batch 1 — poster WhatsApp</title>
<style>
@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 400 800;
  font-display: block;
  src: url('../fonts/plus-jakarta-sans-latin.woff2') format('woff2');
}
:root {
  --merah: #B5202A;
  --merah-dark: #8E191F;
  --merah-tint: #F9EAE4;
  --emas: #C9974B;
  --hitam: #1A1A1A;
  --krem: #F5EFE0;
  --putih: #FFFDF8;
  --ink-mute: #5C5751;
  --hairline: rgba(26, 26, 26, .14);
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: var(--krem);
  color: var(--hitam);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
#artboard {
  position: relative;
  width: 1080px;
  height: 1350px;
  background:
    radial-gradient(120% 70% at 100% 0%, rgba(181, 32, 42, .07), transparent 52%),
    radial-gradient(90% 50% at 0% 100%, rgba(201, 151, 75, .12), transparent 48%),
    linear-gradient(180deg, var(--putih) 0%, var(--krem) 100%);
  display: flex;
  flex-direction: column;
}

.top {
  padding: 52px 64px 36px;
}
.brand-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 36px;
}
.brand-row img {
  height: 58px;
  width: auto;
  display: block;
}
.kicker {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--merah);
  padding-bottom: 8px;
  white-space: nowrap;
}
h1 {
  font-size: 64px;
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: .95;
  text-wrap: balance;
}
h1 .em { color: var(--merah); }
.lead {
  margin-top: 22px;
  font-size: 28px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--ink-mute);
  max-width: 22ch;
}

.photo {
  flex: 1;
  min-height: 0;
  width: 1080px;
  margin: 0;
  overflow: hidden;
}
.photo img {
  width: 1080px;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  display: block;
}

.bottom {
  padding: 36px 64px 40px;
}
.stats {
  display: flex;
  gap: 0;
  list-style: none;
  margin-bottom: 22px;
}
.stats li {
  flex: 1;
}
.stats li + li {
  border-left: 1px solid var(--hairline);
  padding-left: 28px;
}
.stats b {
  display: block;
  font-size: 52px;
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stats span {
  display: block;
  margin-top: 8px;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.date {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: 22px;
}
.date em {
  font-style: normal;
  color: var(--merah);
}
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  padding: 0 28px;
  background: var(--merah);
  color: #fff;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.01em;
  border-radius: 8px;
}
.partners {
  margin-top: 28px;
  padding-top: 22px;
  border-top: 1px solid var(--hairline);
}
.partners p {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 14px;
}
.partner-row {
  display: flex;
  align-items: center;
  gap: 28px;
}
.partner-row img {
  height: 42px;
  width: auto;
  display: block;
}
.partner-row .div {
  width: 1px;
  height: 28px;
  background: var(--hairline);
}
</style>
</head>
<body>
<div id="artboard">
  <header class="top">
    <div class="brand-row">
      <img src="../images/rise/brand/larise-red.webp" alt="LARISE" width="265" height="58">
      <p class="kicker">Program wirausaha · Batch 1</p>
    </div>
    <h1>MULAI DARI <span class="em">NOL.</span><br>BANGKIT <span class="em">BERSAMA.</span></h1>
    <p class="lead">2 bulan online. Mentor, praktek, teman seperjalanan.</p>
  </header>

  <figure class="photo">
    <img src="../images/rise/photos/hero.webp"
         alt="Penjual muda menelepon pembeli sambil menyegel paket"
         width="1080" height="620">
  </figure>

  <footer class="bottom">
    <ul class="stats">
      <li><b>20</b><span>Peserta</span></li>
      <li><b>16</b><span>Sesi</span></li>
      <li><b>2</b><span>Bulan</span></li>
    </ul>
    <p class="date">Mulai <em>2 September 2026</em></p>
    <p class="cta">Balas chat ini untuk daftar</p>
    <div class="partners">
      <p>Mitra</p>
      <div class="partner-row">
        <img src="../images/brand/logo-horizontal-red.png" alt="LarisID" width="168" height="42">
        <span class="div" aria-hidden="true"></span>
        <img src="../images/rise/partners/delima-international.png" alt="Delima International" width="138" height="42">
      </div>
    </div>
  </footer>
</div>
</body>
</html>
