<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=1080">
<title>LARISE Batch 1 — poster WhatsApp</title>
<style>
@font-face {
  font-family: 'Plus Jakarta Sans';
  font-style: normal;
  font-weight: 400 800;
  font-display: block;
  src: url('../fonts/plus-jakarta-sans-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Protest Revolution';
  font-style: normal;
  font-weight: 400;
  font-display: block;
  src: url('../fonts/protest-revolution-latin.woff2') format('woff2');
}
:root {
  --merah: #B5202A;
  --merah-dark: #8E191F;
  --emas: #C9974B;
  --hitam: #1A1A1A;
  --krem: #F5EFE0;
  --putih: #FFFDF8;
  --ink-mute: #5C5751;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --display: 'Protest Revolution', 'Plus Jakarta Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px;
  height: 1350px;
  overflow: hidden;
  background: var(--hitam);
  color: var(--krem);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
#artboard {
  width: 1080px;
  height: 1350px;
  display: flex;
  flex-direction: column;
  background: var(--hitam);
}

.top {
  position: relative;
  z-index: 1;
  padding: 32px 48px 22px;
  background:
    radial-gradient(90% 120% at 100% 0%, rgba(181, 32, 42, .45), transparent 58%),
    linear-gradient(180deg, #2a1214 0%, var(--hitam) 100%);
}
.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.brand-row img {
  height: 52px;
  width: auto;
  display: block;
}
.stamp {
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: var(--merah);
  color: var(--krem);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transform: rotate(-8deg);
  box-shadow: 0 0 0 6px var(--hitam), 0 0 0 8px var(--emas);
  flex-shrink: 0;
}
.stamp small {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.stamp b {
  font-family: var(--display);
  font-size: 34px;
  line-height: .9;
  letter-spacing: .04em;
}
.dibuka {
  font-family: var(--display);
  font-size: 42px;
  letter-spacing: .08em;
  color: var(--emas);
  margin-bottom: 6px;
}
.open {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--krem);
  opacity: .82;
  margin-bottom: 16px;
}
h1 {
  font-size: 54px;
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: .95;
}
h1 .em { color: #ffd6b0; }
.lead {
  margin-top: 14px;
  font-size: 26px;
  font-weight: 600;
  line-height: 1.3;
  color: rgba(245, 239, 224, .82);
  max-width: 28ch;
}

.photo {
  position: relative;
  z-index: 2;
  width: 1080px;
  height: 560px;
  margin: 0 0 -36px;
  overflow: hidden;
  flex-shrink: 0;
}
.photo img {
  width: 1080px;
  height: 560px;
  object-fit: cover;
  object-position: 48% 38%;
  display: block;
}
.photo::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 90px;
  background: linear-gradient(180deg, transparent, var(--merah));
  pointer-events: none;
}

.bottom {
  flex: 1;
  background: var(--merah);
  padding: 48px 48px 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.stats {
  display: flex;
  gap: 14px;
  list-style: none;
  margin-bottom: 18px;
}
.stats li {
  flex: 1;
  background: rgba(255, 253, 248, .14);
  border: 1.5px solid rgba(245, 239, 224, .28);
  padding: 14px 12px 12px;
  text-align: center;
}
.stats b {
  display: block;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: 1;
  color: var(--krem);
  font-variant-numeric: tabular-nums;
}
.stats span {
  display: block;
  margin-top: 6px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(245, 239, 224, .8);
}
.date {
  font-size: 28px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 16px;
  color: var(--krem);
}
.date em {
  font-style: normal;
  color: #ffd6b0;
}
.cta {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 64px;
  background: var(--krem);
  color: var(--merah-dark);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.01em;
  border-radius: 8px;
}
.partners {
  margin-top: auto;
  background: var(--krem);
  margin-left: -48px;
  margin-right: -48px;
  padding: 16px 48px 18px;
}
.partners p {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 10px;
}
.partner-row {
  display: flex;
  align-items: center;
  gap: 24px;
}
.partner-row img {
  height: 42px;
  width: auto;
  display: block;
}
.partner-row .div {
  width: 1px;
  height: 28px;
  background: rgba(26, 26, 26, .18);
}
</style>
</head>
<body>
<div id="artboard">
  <header class="top">
    <div class="brand-row">
      <img src="../images/rise/brand/larise-light.webp" alt="LARISE" width="238" height="52">
      <div class="stamp" aria-label="Batch 1">
        <small>Batch</small>
        <b>1</b>
      </div>
    </div>
    <p class="dibuka">DIBUKA</p>
    <p class="open">Open recruitment · program wirausaha</p>
    <h1>MULAI DARI <span class="em">NOL.</span><br>BANGKIT <span class="em">BERSAMA.</span></h1>
    <p class="lead">2 bulan online. Mentor, praktek, teman seperjalanan.</p>
  </header>

  <figure class="photo">
    <img src="../images/rise/photos/community.webp"
         alt="Lima generasi muda mengemas pesanan bersama sambil melihat satu ponsel"
         width="1080" height="560">
  </figure>

  <footer class="bottom">
    <ul class="stats">
      <li><b>20</b><span>Peserta</span></li>
      <li><b>16</b><span>Sesi</span></li>
      <li><b>2</b><span>Bulan</span></li>
    </ul>
    <p class="date">Mulai <em>2 September 2026</em></p>
    <p class="cta">Balas chat ini untuk daftar</p>
    <div class="partners">
      <p>Mitra</p>
      <div class="partner-row">
        <img src="../images/brand/logo-horizontal-red.png" alt="LarisID" width="168" height="42">
        <span class="div" aria-hidden="true"></span>
        <img src="../images/rise/partners/delima-international.png" alt="Delima International" width="138" height="42">
      </div>
    </div>
  </footer>
</div>
</body>
</html>
