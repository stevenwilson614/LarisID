<!DOCTYPE html>
<html lang="id" data-mode="student">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>MasterMind with Anton GC — prototype offline</title>
  <link rel="stylesheet" href="/fonts/laris-fonts.css">
  <link rel="stylesheet" href="./css/school.css?v=20260920r">
</head>
<body>
  <div id="prod-block" hidden>
    <p>Prototype localhost. Tidak untuk larisid.com.</p>
  </div>
  <div id="app" class="is-student">
    <header class="topbar">
      <div class="brand">
        <img id="school-logo" src="./assets/obrolan/profile.png" alt="" width="32" height="32">
        <div>
          <strong id="school-name">MasterMind with Anton GC</strong>
          <span class="off-badge">Offline · jangan deploy</span>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="sr-only" for="role-switch">Peran</label>
        <select id="role-switch" aria-label="Peran"></select>
        <label class="sr-only" for="persona-switch">Siswa</label>
        <select id="persona-switch" aria-label="Pilih siswa"></select>
        <button type="button" class="ghost" id="btn-reset" title="Reset data lokal">Reset</button>
      </div>
    </header>
    <div id="clock-bar" class="clock-bar" hidden></div>
    <div class="workspace">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <main id="main" class="main"></main>
    </div>
    <nav class="dock" id="dock" hidden></nav>
  </div>
  <aside id="drawer" class="drawer" hidden></aside>
  <div id="drawer-scrim" class="scrim" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="./js/seed.js?v=20260920r"></script>
  <script src="./js/app.js?v=20260920r"></script>
</body>
</html>
